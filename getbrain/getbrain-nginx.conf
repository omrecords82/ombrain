# getbrain edge — proxies orthodoxmetrics.com/getbrain/* to the local
# getbrain service (127.0.0.1:8395) on om-prod01 (.239).
#
# LAN-only: the location is restricted to the internal subnet. Place this
# inside the existing server { } block for orthodoxmetrics.com, or include it.
#
# Install: see om-brain/getbrain/README.md

location /getbrain/ {
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny  all;

    proxy_pass         http://127.0.0.1:8395/getbrain/;
    proxy_http_version 1.1;
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

# Optional convenience redirect so /getbrain (no slash) works.
location = /getbrain {
    return 301 /getbrain/;
}
