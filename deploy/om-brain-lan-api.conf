# om-brain LAN API edge — exposes the Brain REST API to the internal subnet.
#
# Brain binds loopback-only (127.0.0.1:8390). This nginx site listens on the
# om-dev LAN address (192.168.1.254:8390) and proxies to the local service.
# Subnet allowlist matches getbrain / ombrain client expectations.
#
# Install: sudo om-brain/deploy/install-brain-lan-nginx.sh
# Verify:  curl -s http://192.168.1.254:8390/health

server {
    listen 192.168.1.254:8390;

    access_log /var/log/nginx/om-brain-lan-api.access.log;
    error_log  /var/log/nginx/om-brain-lan-api.error.log;

    location / {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass         http://127.0.0.1:8390;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }
}
