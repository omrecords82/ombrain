# Drop-in for omdev (192.168.1.254).
# The live memory DB under /var/lib/om-brain is multi-GB. Running
# scripts/init-db.js on every start (ExecStartPre) opens that DB, can hang,
# and has taken om-brain.service down. Seed only when the DB file is absent.
[Service]
ExecStartPre=
TimeoutStartSec=180
