# om-brain-console LAN edge — operator UI on om-dev (.254).
#
# Console binds loopback (127.0.0.1:8392). nginx exposes LAN on 192.168.1.254:8392.
# Subnet allowlist: internal LAN only — no public internet exposure.
#
# Install: sudo bash /opt/om-brain-console/deploy/install-brain-console-nginx.sh
# Verify:  curl -s http://192.168.1.254:8392/health

server {
    listen 192.168.1.254:8392;

    access_log /var/log/nginx/om-brain-console.access.log;
    error_log  /var/log/nginx/om-brain-console.error.log;

    location / {
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        proxy_pass         http://127.0.0.1:8392;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }
}
