# om-brain webhook edge — Fork A §4
#
# Listens on auth01 (192.168.1.254) port 8391. Only OMStudio (.242) may reach
# the ingest endpoint; localhost may reach /health for on-host verification.
#
# Install: sudo om-brain/deploy/install-webhook-nginx.sh
# Verify:  curl -s http://127.0.0.1:8391/health

server {
    listen 8391;
    listen [::]:8391;

    access_log /var/log/nginx/om-brain-webhook.access.log;
    error_log  /var/log/nginx/om-brain-webhook.error.log;

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.1.242;
        deny all;

        proxy_pass         http://127.0.0.1:8390/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location ~ ^/governance/approvals/[0-9]+/ingest-status$ {
        allow 192.168.1.242;
        deny all;

        limit_except POST { deny all; }
        proxy_pass         http://127.0.0.1:8390;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Content-Type      $content_type;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location / {
        return 404;
    }
}
