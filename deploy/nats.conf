# om-brain fleet NATS broker — LAN only (om-dev .254)
# Install: cp deploy/nats.conf /etc/nats/nats.conf
# Brain + satellites use NATS_URL=nats://192.168.1.254:4222 (not public internet)

port: 4222
host: "192.168.1.254"

# Optional token auth — set same value in om-brain.env and satellite env
# authorization {
#   token: $NATS_TOKEN
# }

max_payload: 1048576
max_connections: 64

jetstream: false

http_port: 8222
http: "127.0.0.1:8222"
