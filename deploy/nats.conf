# om-brain fleet NATS broker — LAN/loopback only (om-dev .254)
# Install: cp deploy/nats.conf /etc/nats/nats.conf

port: 4222
host: "192.168.1.254"

# Optional token auth — set same value in om-brain.env and satellite env
# authorization {
#   token: $NATS_TOKEN
# }

max_payload: 1048576
max_connections: 64

# No JetStream — request/reply only for fleet spawn
jetstream: false

# Monitoring (loopback only)
http_port: 8222
http: "127.0.0.1:8222"
