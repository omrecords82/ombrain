# Ops-side statusjson/objectjson Basic auth (Apache)
# Installed on 192.168.1.40 as conf-available/nagios4-statusjson-auth.conf
# UI remains LAN IP allowlisted; only JSON CGI requires ombrain-nagios-ro.

<Directory "/usr/lib/cgi-bin/nagios4">
    <FilesMatch "^(statusjson|objectjson)\.cgi$">
        AuthType Basic
        AuthName "Nagios statusjson (read-only)"
        AuthUserFile /etc/nagios4/passwd.ombrain-ro
        Require user ombrain-nagios-ro
    </FilesMatch>
</Directory>
