# Ops-side statusjson Basic auth snippet (Apache)
# Apply on 192.168.1.40 when SSH access is available.
# Restricts CGI to the ombrain-nagios-ro identity; retain network allowlists.

<Directory "/usr/lib/cgi-bin/nagios4">
    AuthType Basic
    AuthName "Nagios statusjson (read-only)"
    AuthUserFile /etc/nagios4/passwd.ombrain-ro
    Require user ombrain-nagios-ro
    # Optionally also require client IP:
    # Require ip 192.168.1.254
</Directory>
