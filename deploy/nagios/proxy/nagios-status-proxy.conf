# Local authenticated Nagios statusjson proxy (om-dev).
# Listens on 127.0.0.1:18080 only. Requires Basic auth.
# Upstream remains ops :8080 until ops-side auth can be applied.

server {
    listen 127.0.0.1:18080;
    server_name nagios-status-proxy;

    location /nagios4/cgi-bin/statusjson.cgi {
        auth_basic           "OMBrain Nagios status (read-only)";
        auth_basic_user_file /etc/om-brain/nagios-status.htpasswd;

        proxy_pass http://192.168.1.40:8080/nagios4/cgi-bin/statusjson.cgi;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header Authorization;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
