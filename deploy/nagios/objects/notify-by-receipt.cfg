# Local receipt sink commands — structured argv for nagios-notify-receipt.sh
# (enable_environment_macros may be 0; do not rely on NAGIOS_* env vars).
#
# Merge into /etc/nagios4/objects/commands.cfg (or include from conf.d).

define command {
    command_name    notify-host-by-receipt
    command_line    /usr/local/bin/nagios-notify-receipt.sh host "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$HOSTSTATE$" "$HOSTOUTPUT$" "$NOTIFICATIONAUTHOR$" "$NOTIFICATIONCOMMENT$" "$CONTACTNAME$" "$LONGDATETIME$"
}

define command {
    command_name    notify-service-by-receipt
    command_line    /usr/local/bin/nagios-notify-receipt.sh service "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$SERVICEDESC$" "$SERVICESTATE$" "$SERVICEOUTPUT$" "$NOTIFICATIONAUTHOR$" "$NOTIFICATIONCOMMENT$" "$CONTACTNAME$" "$LONGDATETIME$"
}
