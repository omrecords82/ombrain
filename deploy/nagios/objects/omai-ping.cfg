define hostgroup {
    hostgroup_name  omai-ping-targets
    alias           OMAI Network Ping Targets
    members         om-sh1,ops,om-dev,keycloak,auth01,om-workshop,sushi,omevaluator,omstudio,om-dbp01,omstudio-dev,om-prod01,juju,dc01,host-192-168-1-234,host-192-168-1-233,operator,vegu
}

define service {
    use                     generic-service
    hostgroup_name          omai-ping-targets
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}
