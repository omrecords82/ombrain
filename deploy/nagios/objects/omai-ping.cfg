# Inventory-named ping hosts for Nagios on ops (.40)
# Applied under /etc/nagios4/conf.d/omai-ping.cfg

define host {
    name                    omai-ping-host
    use                     generic-host
    check_command           check-host-alive
    max_check_attempts      3
    check_interval          5
    retry_interval          1
    contact_groups          admins
    notification_options    d,u,r
    notification_interval   60
    register                0
}

define host {
    use         omai-ping-host
    host_name   om-sh1
    alias       om-sh1 (192.168.1.79)
    address     192.168.1.79
}

define host {
    use         omai-ping-host
    host_name   ops
    alias       ops / omai-ops01 (192.168.1.40)
    address     192.168.1.40
}

