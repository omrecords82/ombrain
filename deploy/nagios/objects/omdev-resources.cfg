# Constrained om-dev resource checks — ops (.40) → om-dev (.254)
#
# Remote execution uses a dedicated SSH identity with ForceCommand so only
# allowlisted check names in omdev-resource-check-ssh.sh may run.
# Identity path on ops: /etc/nagios4/id_omdev_checks (mode 600, nagios-readable).
#
# Apply: copy to /etc/nagios4/conf.d/, validate, reload nagios4.
# Install checker on om-dev first (see deploy/nagios/scripts/install-omdev-resource-checks.sh).

define command {
    command_name    check_omdev_resource
    command_line    $USER1$/check_by_ssh -H $HOSTADDRESS$ -l next -i /etc/nagios4/id_omdev_checks -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -C $ARG1$ -t 30
}

define service {
    use                     generic-service
    host_name               om-dev
    service_description     Root Disk
    check_command           check_omdev_resource!root_disk
    max_check_attempts      3
    check_interval          5
    retry_interval          1
    notifications_enabled   1
}

