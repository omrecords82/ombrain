# OMBrain Nagios coverage expansion — service definitions for ops (.40)
#
# Apply on the Nagios host under /etc/nagios4/conf.d/ then
#   sudo /usr/sbin/nagios4 -v /etc/nagios4/nagios.cfg && sudo systemctl reload nagios4
#
# Hosts use inventory names (om-dbp01, keycloak, …). No secrets embedded.
# MariaDB uses TCP readiness until a monitor account is provisioned.
# NRPE disk checks omitted until check_nrpe is installed on ops.

define command {
    command_name    check_http_expect
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -I $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e $ARG3$ -w $ARG4$ -c $ARG5$
}

define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w $ARG2$ -c $ARG3$
}

define command {
    command_name    check_nfs_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 2049 -w 2 -c 5
}

define command {
    command_name    check_freeipa_https
    command_line    $USER1$/check_http -H auth01 -I $HOSTADDRESS$ -S -u /ipa/ui/ -e 200,301,302 -w 3 -c 8
}

# MariaDB (.241) — TCP 3306 until check_mysql monitor credentials exist
define service {
    use                     generic-service
    host_name               om-dbp01
    service_description     MariaDB TCP 3306
    check_command           check_tcp_port!3306!2!5
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notifications_enabled   1
}

# Keycloak (.253) — HTTP root (this build returns 302; /health* 404)
define service {
    use                     generic-service
    host_name               keycloak
    service_description     Keycloak HTTP
    check_command           check_http_expect!8080!/!200,301,302!2!5
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notifications_enabled   1
}

# FreeIPA (.252) — HTTPS (SNI auth01)
define service {
    use                     generic-service
    host_name               auth01
    service_description     FreeIPA HTTPS
    check_command           check_freeipa_https
    max_check_attempts      3
    check_interval          3
    retry_interval          1
    notifications_enabled   1
}

# NFS (.79) — notifications off until 2049 exposure confirmed
define service {
    use                     generic-service
    host_name               om-sh1
    service_description     NFS TCP 2049
    check_command           check_nfs_tcp
    max_check_attempts      3
    check_interval          5
    retry_interval          1
    notifications_enabled   0
}

# OMBrain webhook on om-dev (.254:8391) — ops (.40) must be allowlisted on /health
define service {
    use                     generic-service
    host_name               om-dev
    service_description     OMBrain Webhook
    check_command           check_http_expect!8391!/health!200!2!5
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notifications_enabled   1
}
