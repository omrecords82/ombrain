# OMBrain Nagios coverage expansion — service definitions for ops (.40)
#
# Apply on the Nagios host (SSH required) under /etc/nagios4/conf.d/ then
#   sudo nagios4 -v /etc/nagios4/nagios.cfg && sudo systemctl reload nagios4
#
# These checks are least-privilege / read-only where credentials are needed.
# Do NOT embed secrets here — reference /etc/nagios4/private/ or env files.

define command {
    command_name    check_mariadb_select1
    command_line    $USER1$/check_mysql -H $HOSTADDRESS$ -P 3306 -u $ARG1$ -p $ARG2$ -d $ARG3$
}

define command {
    command_name    check_http_expect
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e $ARG3$ -w $ARG4$ -c $ARG5$
}

define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w $ARG2$ -c $ARG3$
}

define command {
    command_name    check_nfs_tcp
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 2049 -w 2 -c 5
}

define command {
    command_name    check_freeipa_https
    command_line    $USER1$/check_http -H auth01 -I $HOSTADDRESS$ -S -u /ipa/ui/ -e 200,301,302 -w 3 -c 8
}

# MariaDB (.241) — authenticated SELECT 1 via check_mysql (creds in resource.cfg / private)
define service {
    use                     generic-service
    host_name               host-192-168-1-241
    service_description     MariaDB Select1
    check_command           check_mariadb_select1!nagios_monitor!USE_PRIVATE_PASSWORD!mysql
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_interval   30
    notifications_enabled   1
}

# Keycloak (.253) — HTTP root readiness (Quarkus /health not exposed on this build)
define service {
    use                     generic-service
    host_name               host-192-168-1-253
    service_description     Keycloak HTTP
    check_command           check_http_expect!8080!/!200!2!5
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notifications_enabled   1
}

# FreeIPA (.252) — HTTPS (SNI auth01)
define service {
    use                     generic-service
    host_name               host-192-168-1-252
    service_description     FreeIPA HTTPS
    check_command           check_freeipa_https
    max_check_attempts      3
    check_interval          3
    retry_interval          1
    notifications_enabled   1
}

# NFS (.79)
define service {
    use                     generic-service
    host_name               host-192-168-1-79
    service_description     NFS TCP 2049
    check_command           check_nfs_tcp
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notifications_enabled   1
}

# OMBrain webhook on om-dev (.254:8391)
define service {
    use                     generic-service
